name: Keep Streamlit Awake

on:
  schedule:
    - cron: "0 1,9,17 * * *"   # 3 pings a day, 8 hours apart (UTC)
  workflow_dispatch:            # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Streamlit app
        run: |
          for i in 1 2 3; do
            response=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 120 https://stockanalysis-gumynfcbaryzj7qbpfo9li.streamlit.app)
            echo "Attempt $i -> HTTP status: $response"
            if [ "$response" = "200" ]; then
              echo "App is awake"
              exit 0
            fi
            echo "Retrying in 60s..."
            sleep 60
          done
          echo "App did not return 200, but the ping traffic was still sent."
