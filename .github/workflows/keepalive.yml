name: Keep Streamlit Awake

on:
  schedule:
    - cron: "0 1,9,17 * * *"   # 3 pings a day, 8 hours apart (UTC)
  workflow_dispatch:            # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Streamlit app
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://stockanalysis-gumynfcbaryzj7qbpfo9li.streamlit.app)
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then exit 1; fi
